<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Market Sentiment Dashboard</title>
<style>
/* ── Reset & Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0b0d14;
  --surface:   #111420;
  --surface2:  #181c2b;
  --border:    #1e2438;
  --accent:    #4f7cff;
  --green:     #00d97e;
  --red:       #ff4d6d;
  --yellow:    #ffd060;
  --text:      #e2e8f0;
  --text-dim:  #7a88a8;
  --radius:    10px;
  --shadow:    0 4px 24px rgba(0,0,0,.45);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  min-height: 100vh;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Layout ───────────────────────────────────────────────── */
#app { display: flex; flex-direction: column; min-height: 100vh; }

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -.3px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo span { color: var(--accent); }

.header-meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--text-dim);
}

#last-update { white-space: nowrap; }

.btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 7px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: opacity .2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { opacity: .85; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }

/* ── Symbol Tabs ──────────────────────────────────────────── */
.symbol-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.group-label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .8px;
  margin-right: 4px;
}

.sym-chip {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all .15s;
  white-space: nowrap;
}
.sym-chip:hover { border-color: var(--accent); color: var(--text); }
.sym-chip.active {
  background: rgba(79,124,255,.15);
  border-color: var(--accent);
  color: var(--accent);
}
.sym-chip.bullish { border-color: var(--green); color: var(--green); background: rgba(0,217,126,.08); }
.sym-chip.bearish { border-color: var(--red); color: var(--red); background: rgba(255,77,109,.08); }

/* ── Main Content ─────────────────────────────────────────── */
main {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 0;
  flex: 1;
}

/* ── Cards Area ───────────────────────────────────────────── */
.cards-area {
  padding: 24px;
  overflow-y: auto;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
  gap: 20px;
}

/* ── Symbol Card ──────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color .2s;
  position: relative;
}
.card:hover { border-color: #2a3050; }
.card.bullish { border-left: 3px solid var(--green); }
.card.bearish  { border-left: 3px solid var(--red); }
.card.neutral  { border-left: 3px solid var(--text-dim); }

.card-header {
  padding: 16px 18px 10px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.card-title { flex: 1; }
.card-symbol {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -.2px;
}
.card-name {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 1px;
}

.card-price {
  text-align: right;
  line-height: 1.3;
}
.price-value {
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.price-change {
  font-size: 12px;
  font-weight: 600;
  margin-top: 2px;
}
.up { color: var(--green); }
.down { color: var(--red); }
.flat { color: var(--text-dim); }

/* Sentiment Bar */
.sentiment-row {
  padding: 10px 18px 12px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.sentiment-badge {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .6px;
  padding: 3px 10px;
  border-radius: 4px;
  white-space: nowrap;
}
.badge-bullish { background: rgba(0,217,126,.2); color: var(--green); }
.badge-bearish  { background: rgba(255,77,109,.2); color: var(--red); }
.badge-neutral  { background: rgba(122,136,168,.15); color: var(--text-dim); }

.confidence-wrap { flex: 1; }
.confidence-label {
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}
.confidence-bar {
  height: 5px;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
}
.confidence-fill {
  height: 100%;
  border-radius: 3px;
  transition: width .6s ease;
}
.fill-bullish { background: var(--green); }
.fill-bearish  { background: var(--red); }
.fill-neutral  { background: var(--text-dim); }

/* Summary */
.card-summary {
  padding: 0 18px 12px;
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.6;
}

/* Levels */
.levels-section {
  padding: 10px 18px;
  background: var(--surface2);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.levels-col label {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .8px;
  margin-bottom: 6px;
  font-weight: 600;
}
.levels-col.support label { color: var(--green); }
.levels-col.resistance label { color: var(--red); }

.level-pill {
  display: inline-block;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 3px 9px;
  border-radius: 4px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  margin: 2px 3px 2px 0;
}
.level-pill.sup { border-color: rgba(0,217,126,.3); color: var(--green); }
.level-pill.res { border-color: rgba(255,77,109,.3); color: var(--red); }

/* Prediction */
.prediction-row {
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.pred-badge {
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 14px;
  border-radius: 6px;
  white-space: nowrap;
}
.pred-up   { background: rgba(0,217,126,.15); color: var(--green); }
.pred-down { background: rgba(255,77,109,.15); color: var(--red); }
.pred-side { background: rgba(122,136,168,.12); color: var(--text-dim); }

.pred-meta {
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.6;
}
.pred-meta strong { color: var(--text); }

/* Indicators row */
.indicators-row {
  padding: 8px 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  border-top: 1px solid var(--border);
}
.ind-item {
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 4px;
}
.ind-item strong { color: var(--text); }
.ind-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
}
.dot-green { background: var(--green); }
.dot-red   { background: var(--red); }
.dot-yellow{ background: var(--yellow); }
.dot-gray  { background: var(--text-dim); }

/* Reasons & Risks */
.card-reasons {
  padding: 10px 18px 8px;
  border-top: 1px solid var(--border);
}
.card-reasons h4 {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.card-reasons ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.card-reasons li {
  font-size: 12px;
  color: var(--text-dim);
  padding-left: 14px;
  position: relative;
  line-height: 1.5;
}
.card-reasons li::before {
  content: '▸';
  position: absolute;
  left: 0;
  color: var(--accent);
  font-size: 10px;
}

/* Card footer */
.card-footer {
  padding: 8px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,.15);
}
.card-time { font-size: 10px; color: var(--text-dim); }

/* ── Right Sidebar ────────────────────────────────────────── */
.sidebar {
  border-left: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  height: calc(100vh - 90px);
  position: sticky;
  top: 90px;
  overflow: hidden;
}

.sidebar-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
}
.stab {
  flex: 1;
  padding: 12px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .15s;
}
.stab:hover { color: var(--text); }
.stab.active { color: var(--accent); border-bottom-color: var(--accent); }

.sidebar-panel {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: none;
}
.sidebar-panel.active { display: block; }

/* News */
.news-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.news-item:last-child { border-bottom: none; }
.news-source {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.news-title {
  font-size: 12px;
  font-weight: 600;
  line-height: 1.5;
  color: var(--text);
  margin-bottom: 4px;
}
.news-title a:hover { color: var(--accent); }
.news-summary {
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.news-meta {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 5px;
}

/* Events */
.event-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.event-item:last-child { border-bottom: none; }
.event-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.impact-badge {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .5px;
  padding: 2px 6px;
  border-radius: 3px;
  text-transform: uppercase;
}
.impact-HIGH   { background: rgba(255,77,109,.2); color: var(--red); }
.impact-MEDIUM { background: rgba(255,208,96,.2); color: var(--yellow); }
.impact-LOW    { background: rgba(122,136,168,.12); color: var(--text-dim); }
.event-country { font-size: 10px; font-weight: 700; color: var(--text-dim); }
.event-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.event-title a { color: var(--text); }
.event-title a:hover { color: var(--accent); }
.event-time { font-size: 10px; color: var(--text-dim); }
.event-data {
  display: flex;
  gap: 12px;
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 3px;
}
.event-data span strong { color: var(--text); }

/* ── Loading & Error States ───────────────────────────────── */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(11,13,20,.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
  gap: 16px;
}
.spinner {
  width: 44px; height: 44px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--text-dim); }

.error-banner {
  background: rgba(255,77,109,.1);
  border: 1px solid rgba(255,77,109,.3);
  color: var(--red);
  padding: 12px 20px;
  border-radius: 8px;
  margin: 12px 24px;
  font-size: 13px;
  display: none;
}

.empty-state {
  padding: 60px 20px;
  text-align: center;
  color: var(--text-dim);
}
.empty-state svg { margin-bottom: 16px; opacity: .4; }

/* ── Toast ────────────────────────────────────────────────── */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 13px;
  animation: slideIn .25s ease;
  max-width: 320px;
}
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } }

/* ── Scrollbar ────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #2a3050; }

/* ── Responsive ───────────────────────────────────────────── */
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  .sidebar {
    position: static;
    height: auto;
    border-left: none;
    border-top: 1px solid var(--border);
  }
  .cards-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="app">

  <!-- Header -->
  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
        <polyline points="16 7 22 7 22 13"/>
      </svg>
      Market <span>Sentiment</span>
    </div>
    <div class="header-meta">
      <span id="last-update">Not loaded yet</span>
      <button class="btn btn-sm btn-outline" id="btn-refresh" onclick="refreshAll()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Refresh
      </button>
    </div>
  </header>

  <!-- Symbol selection bar -->
  <div class="symbol-bar" id="symbol-bar">
    <span class="group-label">Loading symbols…</span>
  </div>

  <!-- Error banner -->
  <div class="error-banner" id="error-banner"></div>

  <main>
    <!-- Cards -->
    <div class="cards-area">
      <div class="cards-grid" id="cards-grid">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <p>Select symbols above to load analysis</p>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-tabs">
        <div class="stab active" onclick="switchTab('news')">News Feed</div>
        <div class="stab" onclick="switchTab('calendar')">Economic Events</div>
      </div>
      <div class="sidebar-panel active" id="panel-news">
        <p style="color:var(--text-dim);font-size:12px">Load analysis to see news</p>
      </div>
      <div class="sidebar-panel" id="panel-calendar">
        <p style="color:var(--text-dim);font-size:12px">Loading economic calendar…</p>
      </div>
    </aside>
  </main>

</div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loading-overlay" style="display:none">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Loading analysis…</div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
/* ── State ─────────────────────────────────────────────────── */
// Auto-detect: if opened as a file, point to the running server
const API = (location.protocol === 'file:' || location.port !== '8000')
  ? 'http://localhost:8000'
  : '';
let symbolGroups = {};
let selectedSymbols = [];
let analyses = {};
let activeNewsSymbol = null;
let calendarData = [];
let refreshTimer = null;
const REFRESH_INTERVAL = 5 * 60 * 1000; // 5 minutes

/* ── Boot ──────────────────────────────────────────────────── */
async function boot() {
  try {
    const data = await apiFetch('/api/symbols');
    symbolGroups = data.groups;
    selectedSymbols = [...data.defaults];
    renderSymbolBar();
    await loadDashboard();
    await loadCalendar();
    startAutoRefresh();
  } catch (e) {
    showError('Failed to connect to the API server. Make sure the server is running on port 8000.');
  }
}

/* ── API helper ────────────────────────────────────────────── */
async function apiFetch(path, options = {}) {
  const res = await fetch(API + path, options);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || res.statusText);
  }
  return res.json();
}

/* ── Symbol Bar ────────────────────────────────────────────── */
function renderSymbolBar() {
  const bar = document.getElementById('symbol-bar');
  bar.innerHTML = '';

  for (const [group, symbols] of Object.entries(symbolGroups)) {
    const label = document.createElement('span');
    label.className = 'group-label';
    label.textContent = group;
    bar.appendChild(label);

    for (const sym of symbols) {
      const chip = document.createElement('div');
      chip.className = 'sym-chip';
      chip.textContent = sym;
      chip.dataset.symbol = sym;
      if (selectedSymbols.includes(sym)) chip.classList.add('active');
      chip.onclick = () => toggleSymbol(sym, chip);
      bar.appendChild(chip);
    }
  }
}

function updateChipSentiment(symbol, sentiment) {
  const chip = document.querySelector(`.sym-chip[data-symbol="${symbol}"]`);
  if (!chip) return;
  chip.classList.remove('bullish', 'bearish');
  if (sentiment === 'BULLISH') chip.classList.add('bullish');
  else if (sentiment === 'BEARISH') chip.classList.add('bearish');
}

async function toggleSymbol(sym, chip) {
  const idx = selectedSymbols.indexOf(sym);
  if (idx >= 0) {
    selectedSymbols.splice(idx, 1);
    chip.classList.remove('active', 'bullish', 'bearish');
    removeCard(sym);
    delete analyses[sym];
  } else {
    selectedSymbols.push(sym);
    chip.classList.add('active');
    await loadSingleSymbol(sym);
  }
  updateNewsFeed();
}

/* ── Dashboard load ────────────────────────────────────────── */
async function loadDashboard() {
  if (!selectedSymbols.length) return;
  showLoading(`Analysing ${selectedSymbols.length} symbol(s) with Claude AI…`);
  hideError();
  try {
    const data = await apiFetch(`/api/dashboard?symbols=${selectedSymbols.join(',')}`);
    for (const analysis of data.symbols) {
      analyses[analysis.symbol] = analysis;
    }
    if (data.events?.length) {
      calendarData = data.events;
      renderCalendar();
    }
    renderCards();
    updateLastUpdate();
    toast(`Analysis complete — ${data.symbols.length} symbols loaded`);
  } catch (e) {
    showError(`Dashboard load failed: ${e.message}`);
  } finally {
    hideLoading();
  }
}

async function loadSingleSymbol(symbol) {
  showLoading(`Analysing ${symbol}…`);
  try {
    const analysis = await apiFetch(`/api/analysis/${encodeURIComponent(symbol)}`);
    analyses[symbol] = analysis;
    renderCard(analysis);
    updateChipSentiment(symbol, analysis.sentiment);
    updateNewsFeed();
    toast(`${symbol} analysis ready`);
  } catch (e) {
    showError(`Failed to load ${symbol}: ${e.message}`);
  } finally {
    hideLoading();
  }
}

async function refreshAll() {
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true;
  // Invalidate cache for all selected symbols
  await Promise.allSettled(
    selectedSymbols.map(s => apiFetch(`/api/refresh/${encodeURIComponent(s)}`, { method: 'POST' }))
  );
  await loadDashboard();
  btn.disabled = false;
}

/* ── Cards rendering ───────────────────────────────────────── */
function renderCards() {
  const grid = document.getElementById('cards-grid');
  grid.innerHTML = '';
  for (const sym of selectedSymbols) {
    if (analyses[sym]) renderCard(analyses[sym]);
  }
  if (!grid.children.length) {
    grid.innerHTML = `<div class="empty-state"><p>No analysis data available.</p></div>`;
  }
}

function removeCard(symbol) {
  const existing = document.getElementById(`card-${CSS.escape(symbol)}`);
  if (existing) existing.remove();
}

function renderCard(a) {
  removeCard(a.symbol);

  const sentClass = a.sentiment.toLowerCase();
  const predDir   = a.prediction.direction;
  const predClass = predDir === 'UP' ? 'up' : predDir === 'DOWN' ? 'down' : 'flat';
  const predBadge = predDir === 'UP' ? 'pred-up' : predDir === 'DOWN' ? 'pred-down' : 'pred-side';
  const arrow     = predDir === 'UP' ? '▲' : predDir === 'DOWN' ? '▼' : '◆';
  const changeClass = a.price.change_pct >= 0 ? 'up' : 'down';
  const changeSign  = a.price.change_pct >= 0 ? '+' : '';
  const rsiColor = (a.technical.rsi_14 > 70) ? 'dot-red' : (a.technical.rsi_14 < 30) ? 'dot-green' : 'dot-yellow';
  const macdColor = a.technical.macd_signal === 'BULLISH' ? 'dot-green' : a.technical.macd_signal === 'BEARISH' ? 'dot-red' : 'dot-gray';
  const trendColor = a.technical.trend_signal === 'UPTREND' ? 'dot-green' : a.technical.trend_signal === 'DOWNTREND' ? 'dot-red' : 'dot-gray';

  const supPills = a.technical.supports.map(v =>
    `<span class="level-pill sup">${fmt(v)}</span>`).join('');
  const resPills = a.technical.resistances.map(v =>
    `<span class="level-pill res">${fmt(v)}</span>`).join('');

  const swingSup = a.technical.swing_supports?.map(v =>
    `<span class="level-pill sup" style="opacity:.7">${fmt(v)}</span>`).join('') || '';
  const swingRes = a.technical.swing_resistances?.map(v =>
    `<span class="level-pill res" style="opacity:.7">${fmt(v)}</span>`).join('') || '';

  const reasonsHtml = a.key_reasons.slice(0, 3).map(r =>
    `<li>${escHtml(r)}</li>`).join('');

  const risksHtml = a.risks.slice(0, 2).map(r =>
    `<li style="color:var(--red)">${escHtml(r)}</li>`).join('');

  const target = a.prediction.target ? `Target: <strong>${fmt(a.prediction.target)}</strong>` : '';
  const sl = a.prediction.stop_loss ? `Stop: <strong>${fmt(a.prediction.stop_loss)}</strong>` : '';
  const predMetaParts = [
    `Timeframe: <strong>${a.prediction.timeframe}</strong>`,
    target, sl,
    `Confidence: <strong>${a.prediction.confidence}%</strong>`,
  ].filter(Boolean).join(' · ');

  const analyzedTime = a.analyzed_at
    ? new Date(a.analyzed_at).toLocaleTimeString()
    : 'Unknown';

  const priceDisplay = a.price.currency === 'INR'
    ? `₹${fmtPrice(a.price.current_price)}`
    : a.price.currency === 'USD' || !a.price.currency
      ? `$${fmtPrice(a.price.current_price)}`
      : `${fmtPrice(a.price.current_price)} ${a.price.currency}`;

  const html = `
<div class="card ${sentClass}" id="card-${a.symbol}">
  <div class="card-header">
    <div class="card-title">
      <div class="card-symbol">${escHtml(a.symbol)}</div>
      <div class="card-name">${escHtml(a.display_name || a.symbol)} · ${escHtml(a.group || '')}</div>
    </div>
    <div class="card-price">
      <div class="price-value">${priceDisplay}</div>
      <div class="price-change ${changeClass}">${changeSign}${a.price.change_pct.toFixed(2)}%</div>
    </div>
  </div>

  <div class="sentiment-row">
    <span class="sentiment-badge badge-${sentClass}">${a.sentiment}</span>
    <div class="confidence-wrap">
      <div class="confidence-label">
        <span>AI Confidence</span>
        <span>${a.confidence}%</span>
      </div>
      <div class="confidence-bar">
        <div class="confidence-fill fill-${sentClass}" style="width:${a.confidence}%"></div>
      </div>
    </div>
    <span class="sentiment-badge" style="background:transparent;font-size:10px;color:var(--text-dim)">
      News: <strong style="color:var(--text)">${a.news_sentiment}</strong>
    </span>
  </div>

  <div class="card-summary">${escHtml(a.summary)}</div>

  <div class="levels-section">
    <div class="levels-col support">
      <label>▲ Support Levels</label>
      ${supPills}
      ${swingSup}
    </div>
    <div class="levels-col resistance">
      <label>▼ Resistance Levels</label>
      ${resPills}
      ${swingRes}
    </div>
  </div>

  <div class="prediction-row">
    <div class="pred-badge ${predBadge}">
      ${arrow} ${predDir}
    </div>
    <div class="pred-meta">${predMetaParts}</div>
  </div>

  <div class="indicators-row">
    <div class="ind-item"><span class="ind-dot ${rsiColor}"></span> RSI <strong>${a.technical.rsi_14 ?? '–'}</strong></div>
    <div class="ind-item"><span class="ind-dot ${macdColor}"></span> MACD <strong>${a.technical.macd_signal ?? '–'}</strong></div>
    <div class="ind-item"><span class="ind-dot ${trendColor}"></span> Trend <strong>${a.technical.trend_signal ?? '–'}</strong></div>
    ${a.technical.atr ? `<div class="ind-item">ATR <strong>${fmt(a.technical.atr)}</strong></div>` : ''}
    <div class="ind-item">Event Risk <strong>${a.event_impact}</strong></div>
  </div>

  <div class="card-reasons">
    <h4>Key Reasons</h4>
    <ul>${reasonsHtml}</ul>
    ${risksHtml ? `<h4 style="margin-top:8px">Risks</h4><ul>${risksHtml}</ul>` : ''}
  </div>

  <div class="card-footer">
    <span class="card-time">Analysed at ${analyzedTime}</span>
    <button class="btn btn-sm btn-outline" onclick="refreshSymbol('${a.symbol}')">↻ Refresh</button>
  </div>
</div>`;

  const grid = document.getElementById('cards-grid');
  const emptyState = grid.querySelector('.empty-state');
  if (emptyState) emptyState.remove();

  grid.insertAdjacentHTML('beforeend', html);
  updateChipSentiment(a.symbol, a.sentiment);
}

async function refreshSymbol(symbol) {
  showLoading(`Refreshing ${symbol}…`);
  try {
    const data = await apiFetch(`/api/refresh/${encodeURIComponent(symbol)}`, { method: 'POST' });
    analyses[symbol] = data.analysis;
    renderCard(data.analysis);
    toast(`${symbol} refreshed`);
  } catch (e) {
    showError(`Refresh failed: ${e.message}`);
  } finally {
    hideLoading();
  }
}

/* ── Sidebar ───────────────────────────────────────────────── */
function switchTab(tab) {
  document.querySelectorAll('.stab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0 && tab === 'news') || (i === 1 && tab === 'calendar'));
  });
  document.getElementById('panel-news').classList.toggle('active', tab === 'news');
  document.getElementById('panel-calendar').classList.toggle('active', tab === 'calendar');
}

function updateNewsFeed() {
  // Aggregate all news from loaded analyses
  const panel = document.getElementById('panel-news');
  const allNews = [];
  for (const sym of selectedSymbols) {
    if (!analyses[sym]) continue;
    for (const n of (analyses[sym].news || [])) {
      allNews.push({ ...n, symbol: sym });
    }
  }
  if (!allNews.length) {
    panel.innerHTML = '<p style="color:var(--text-dim);font-size:12px">No news articles available.</p>';
    return;
  }
  panel.innerHTML = allNews.map(n => `
<div class="news-item">
  <div class="news-source">${escHtml(n.source)} · <span style="color:var(--accent)">${escHtml(n.symbol)}</span></div>
  <div class="news-title"><a href="${escHtml(n.url)}" target="_blank">${escHtml(n.title)}</a></div>
  ${n.summary ? `<div class="news-summary">${escHtml(n.summary)}</div>` : ''}
  <div class="news-meta">${n.published ? new Date(n.published).toLocaleString() : ''}</div>
</div>`).join('');
}

async function loadCalendar() {
  try {
    const data = await apiFetch('/api/calendar');
    calendarData = data.events || [];
    renderCalendar();
  } catch (e) {
    document.getElementById('panel-calendar').innerHTML =
      '<p style="color:var(--red);font-size:12px">Failed to load economic calendar.</p>';
  }
}

function renderCalendar() {
  const panel = document.getElementById('panel-calendar');
  if (!calendarData.length) {
    panel.innerHTML = '<p style="color:var(--text-dim);font-size:12px">No upcoming events found.</p>';
    return;
  }
  panel.innerHTML = calendarData.map(e => `
<div class="event-item">
  <div class="event-header">
    <span class="impact-badge impact-${e.impact}">${e.impact}</span>
    <span class="event-country">${escHtml(e.country)}</span>
  </div>
  <div class="event-title">
    ${e.url
      ? `<a href="${escHtml(e.url)}" target="_blank" rel="noopener">${escHtml(e.title)}</a>`
      : escHtml(e.title)}
  </div>
  <div class="event-time">${escHtml(e.scheduled_time)}</div>
  ${(e.forecast || e.previous) ? `
  <div class="event-data">
    ${e.forecast ? `<span>Forecast: <strong>${escHtml(e.forecast)}</strong></span>` : ''}
    ${e.previous ? `<span>Previous: <strong>${escHtml(e.previous)}</strong></span>` : ''}
  </div>` : ''}
</div>`).join('');
}

/* ── Utilities ─────────────────────────────────────────────── */
function fmt(n) {
  if (n == null) return '–';
  const abs = Math.abs(n);
  if (abs >= 10000) return Number(n).toLocaleString('en', {maximumFractionDigits: 0});
  if (abs >= 100)   return Number(n).toLocaleString('en', {maximumFractionDigits: 2});
  if (abs >= 1)     return Number(n).toLocaleString('en', {maximumFractionDigits: 4});
  return Number(n).toLocaleString('en', {maximumFractionDigits: 6});
}

function fmtPrice(n) {
  if (n == null) return '–';
  const abs = Math.abs(n);
  if (abs >= 10000) return n.toLocaleString('en', {maximumFractionDigits: 0});
  if (abs >= 1000)  return n.toLocaleString('en', {maximumFractionDigits: 2});
  if (abs >= 1)     return n.toFixed(4);
  return n.toFixed(6);
}

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function updateLastUpdate() {
  document.getElementById('last-update').textContent =
    'Updated: ' + new Date().toLocaleTimeString();
}

function showLoading(msg = 'Loading…') {
  document.getElementById('loading-text').textContent = msg;
  document.getElementById('loading-overlay').style.display = 'flex';
}

function hideLoading() {
  document.getElementById('loading-overlay').style.display = 'none';
}

function showError(msg) {
  const banner = document.getElementById('error-banner');
  banner.textContent = msg;
  banner.style.display = 'block';
  setTimeout(() => banner.style.display = 'none', 8000);
}

function hideError() {
  document.getElementById('error-banner').style.display = 'none';
}

function toast(msg, duration = 3000) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), duration);
}

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    if (selectedSymbols.length > 0) loadDashboard();
  }, REFRESH_INTERVAL);
}

/* ── Start ─────────────────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', boot);
</script>
