<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PineConnector Dashboard</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2a2d3a;
            --text: #e4e4e7;
            --muted: #71717a;
            --green: #22c55e;
            --red: #ef4444;
            --blue: #3b82f6;
            --orange: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            line-height: 1.5;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        header h1 { font-size: 18px; font-weight: 600; }
        .status-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-ok { background: #16a34a20; color: var(--green); border: 1px solid #16a34a40; }
        .status-warn { background: #f59e0b20; color: var(--orange); border: 1px solid #f59e0b40; }
        .status-err { background: #ef444420; color: var(--red); border: 1px solid #ef444440; }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }
        .card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
        .card .value { font-size: 22px; font-weight: 700; }
        .card .value.positive { color: var(--green); }
        .card .value.negative { color: var(--red); }

        .section { margin-bottom: 24px; }
        .section h2 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section h2 .count {
            background: var(--border);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #ffffff05; }

        .action-buy { color: var(--green); }
        .action-sell { color: var(--red); }
        .pnl-positive { color: var(--green); }
        .pnl-negative { color: var(--red); }

        .btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }
        .btn:hover { background: var(--border); }
        .btn-danger { border-color: #ef444440; color: var(--red); }
        .btn-danger:hover { background: #ef444420; }

        .info-bar {
            display: flex;
            gap: 16px;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 16px;
        }
        .info-bar span { display: flex; align-items: center; gap: 4px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .dot-green { background: var(--green); }
        .dot-red { background: var(--red); }
        .dot-yellow { background: var(--orange); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PineConnector</h1>
            <div>
                <span id="healthBadge" class="status-badge status-warn">LOADING</span>
                <button class="btn btn-danger" onclick="closeAll()" style="margin-left:8px">Close All</button>
            </div>
        </header>

        <div class="info-bar" id="infoBar">
            <span><span class="dot dot-yellow" id="dotRust"></span> Rust Engine: <span id="rustStatus">—</span></span>
            <span><span class="dot dot-yellow" id="dotMt5"></span> MT5: <span id="mt5Status">—</span></span>
            <span>Trades today: <span id="tradesToday">0</span></span>
            <span>Uptime: <span id="uptime">—</span></span>
            <span id="modeLabel"></span>
        </div>

        <div class="cards">
            <div class="card"><div class="label">Net PnL</div><div class="value" id="cardPnl">$0.00</div></div>
            <div class="card"><div class="label">Win Rate</div><div class="value" id="cardWinRate">0%</div></div>
            <div class="card"><div class="label">Profit Factor</div><div class="value" id="cardPF">0.00</div></div>
            <div class="card"><div class="label">Max Drawdown</div><div class="value" id="cardDD">$0.00</div></div>
            <div class="card"><div class="label">Total Trades</div><div class="value" id="cardTotal">0</div></div>
            <div class="card"><div class="label">Expectancy</div><div class="value" id="cardExpect">$0.00</div></div>
        </div>

        <div class="section">
            <h2>Open Trades <span class="count" id="openCount">0</span></h2>
            <table>
                <thead><tr>
                    <th>Signal</th><th>Symbol</th><th>Action</th><th>Lot</th>
                    <th>Entry</th><th>SL</th><th>TP</th><th>Status</th><th>Time</th>
                </tr></thead>
                <tbody id="openTrades"></tbody>
            </table>
        </div>

        <div class="section">
            <h2>Recent Trades <span class="count" id="recentCount">0</span></h2>
            <table>
                <thead><tr>
                    <th>Signal</th><th>Symbol</th><th>Action</th><th>Lot</th>
                    <th>Entry</th><th>Exit</th><th>PnL</th><th>Time</th>
                </tr></thead>
                <tbody id="recentTrades"></tbody>
            </table>
        </div>
    </div>

<script>
const API = window.location.origin;
let refreshInterval;

async function fetchJSON(url) {
    try {
        const r = await fetch(url);
        return r.ok ? await r.json() : null;
    } catch { return null; }
}

async function refreshHealth() {
    const h = await fetchJSON(`${API}/api/health`);
    if (!h) return;

    const badge = document.getElementById('healthBadge');
    const dotRust = document.getElementById('dotRust');
    const dotMt5 = document.getElementById('dotMt5');

    badge.textContent = h.dry_run ? 'DRY RUN' : h.status.toUpperCase();
    badge.className = 'status-badge ' + (h.status === 'ok' ? 'status-ok' : 'status-err');
    if (h.dry_run) badge.className = 'status-badge status-warn';

    document.getElementById('rustStatus').textContent = h.rust_engine;
    dotRust.className = 'dot ' + (h.rust_engine === 'connected' ? 'dot-green' : 'dot-red');

    document.getElementById('mt5Status').textContent = h.mt5_connected ? 'connected' : 'disconnected';
    dotMt5.className = 'dot ' + (h.mt5_connected ? 'dot-green' : 'dot-red');

    document.getElementById('tradesToday').textContent = h.trades_today;
    document.getElementById('uptime').textContent = formatUptime(h.uptime_seconds);
    document.getElementById('modeLabel').textContent = h.dry_run ? '[PAPER MODE]' : '';
}

async function refreshTrades() {
    const open = await fetchJSON(`${API}/api/trades/open`);
    const recent = await fetchJSON(`${API}/api/trades?limit=20`);

    if (open) {
        document.getElementById('openCount').textContent = open.length;
        document.getElementById('openTrades').innerHTML = open.map(t => `
            <tr>
                <td>${t.signal_id?.slice(0,8) || '—'}</td>
                <td>${t.symbol}</td>
                <td class="${t.action?.includes('buy') ? 'action-buy' : 'action-sell'}">${t.action?.toUpperCase()}</td>
                <td>${t.remaining_lot?.toFixed(2) || t.lot?.toFixed(2)}</td>
                <td>${t.entry_price?.toFixed(5) || '—'}</td>
                <td>${t.sl?.toFixed(5) || '—'}</td>
                <td>${t.tp?.toFixed(5) || '—'}</td>
                <td>${t.status}</td>
                <td>${t.open_time?.slice(11,19) || ''}</td>
            </tr>
        `).join('');
    }

    if (recent) {
        const closed = recent.filter(t => t.status === 'closed');
        document.getElementById('recentCount').textContent = closed.length;
        document.getElementById('recentTrades').innerHTML = closed.slice(0, 20).map(t => `
            <tr>
                <td>${t.signal_id?.slice(0,8) || '—'}</td>
                <td>${t.symbol}</td>
                <td class="${t.action?.includes('buy') ? 'action-buy' : 'action-sell'}">${t.action?.toUpperCase()}</td>
                <td>${t.lot?.toFixed(2)}</td>
                <td>${t.entry_price?.toFixed(5) || '—'}</td>
                <td>${t.exit_price?.toFixed(5) || '—'}</td>
                <td class="${(t.profit||0) >= 0 ? 'pnl-positive' : 'pnl-negative'}">$${(t.profit||0).toFixed(2)}</td>
                <td>${t.close_time?.slice(11,19) || ''}</td>
            </tr>
        `).join('');
    }
}

async function refreshAnalytics() {
    const a = await fetchJSON(`${API}/api/analytics?days=30`);
    if (!a) return;

    const pnl = a.pnl || {};
    const wr = a.win_rate || {};
    const dd = a.drawdown || {};

    const pnlEl = document.getElementById('cardPnl');
    pnlEl.textContent = `$${(pnl.net_pnl || 0).toFixed(2)}`;
    pnlEl.className = 'value ' + ((pnl.net_pnl || 0) >= 0 ? 'positive' : 'negative');

    document.getElementById('cardWinRate').textContent = `${(wr.win_rate || 0).toFixed(1)}%`;
    document.getElementById('cardPF').textContent = (wr.profit_factor || 0).toFixed(2);

    const ddEl = document.getElementById('cardDD');
    ddEl.textContent = `$${(dd.max_drawdown || 0).toFixed(2)}`;
    ddEl.className = 'value negative';

    document.getElementById('cardTotal').textContent = wr.total || 0;
    document.getElementById('cardExpect').textContent = `$${(wr.expectancy || 0).toFixed(2)}`;
}

async function closeAll() {
    if (!confirm('Close ALL open positions?')) return;
    await fetch(`${API}/api/close-all`, { method: 'POST' });
    setTimeout(refreshTrades, 1000);
}

function formatUptime(s) {
    if (!s) return '—';
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

async function refreshAll() {
    await Promise.all([refreshHealth(), refreshTrades(), refreshAnalytics()]);
}

refreshAll();
refreshInterval = setInterval(refreshAll, 5000);
</script>
</body>
</html>
