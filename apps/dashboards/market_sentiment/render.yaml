services:
  - type: web
    name: market-sentiment-dashboard
    runtime: python
    rootDir: monitoring/dashboards/market_sentiment
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false        # Set manually in Render dashboard (keeps it secret)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: CACHE_TTL
        value: "300"
      - key: MAX_NEWS_ARTICLES
        value: "10"
